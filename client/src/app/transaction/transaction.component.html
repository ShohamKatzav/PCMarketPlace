<div class="container mt-5">
    <div class="card shadow-sm mx-auto col-md-6 p-4">
        <h2 class="text-center mb-4">Complete Purchase</h2>

        @if (stripe) {
        <form (ngSubmit)="handleSubmit()" class="text-center">
            <div class="d-flex align-items-center mb-4 p-3 bg-light rounded">
                <img [src]="deal()?.dealPhoto?.url" class="rounded me-3"
                    style="width: 80px; height: 80px; object-fit: cover;">
                <div class="text-start">
                    <h6 class="mb-0">{{ deal()?.description }}</h6>
                    <span class="text-success fw-bold">{{ deal()?.totalPrice }} ₪</span>
                </div>
            </div>

            <div class="form-group text-start mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" [(ngModel)]="email" name="email" required class="form-control"
                    placeholder="you@example.com">
            </div>

            <div class="form-group text-start mb-3">
                <label class="form-label">Credit or Debit Card</label>
                <div class="p-3 border rounded bg-white">
                    <div #cardElement></div>
                </div>
                @if (cardErrors()) {
                <div class="text-danger small mt-2">
                    <i class="fa fa-exclamation-circle"></i> {{ cardErrors() }}
                </div>
                }
            </div>

            <button type="submit" [disabled]="!stripe" class="btn btn-primary w-100 py-2 mt-3">
                Pay {{ deal()?.totalPrice }} ₪
            </button>
        </form>
        } @else {
        <div class="text-center p-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">Initializing secure payment...</p>
        </div>
        }
    </div>
</div>

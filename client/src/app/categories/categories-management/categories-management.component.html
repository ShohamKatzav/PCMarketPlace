<div class="container-fluid mt-4 px-5">
    <div class="row align-items-center mb-5">
        <div class="col-lg-6">
            <h1 class="fw-bold mb-0 text-dark">CATEGORY MANAGEMENT</h1>
        </div>

        <div class="col-lg-6 d-flex justify-content-end">
            <div class="input-group shadow-sm" style="max-width: 400px;">
                <input type="text" class="form-control" placeholder="New category name..."
                    [ngModel]="categoryNameToAdd()" (ngModelChange)="categoryNameToAdd.set($event)"
                    (keyup.enter)="addCategory(categoryNameToAdd())">
                <button class="btn btn-success px-4" (click)="addCategory(categoryNameToAdd())">
                    <i class="fa fa-plus me-1"></i> Add
                </button>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light text-muted small">
                    <tr>
                        <th class="ps-4 py-3" style="width: 10%">ID</th>
                        <th style="width: 65%">NAME</th>
                        <th class="text-end pe-4" style="width: 25%">ACTIONS</th>
                    </tr>
                </thead>
                <tbody>
                    @for (cat of categories() | paginate: { itemsPerPage: pageSize(), currentPage: currentPage() };
                    track cat.id) {
                    <tr>
                        <td class="ps-4 text-secondary">#{{ cat.id }}</td>
                        <td>
                            <input type="text" class="form-control form-control-sm w-75 border-0 bg-transparent fw-bold"
                                [ngModel]="cat.name" #inputRef>
                        </td>
                        <td class="pe-4 text-end">
                            <div class="d-flex justify-content-end gap-3">
                                <button class="btn btn-link p-0"
                                    [style.color]="inputRef.value !== cat.name ? 'blue' : 'grey'"
                                    [disabled]="inputRef.value === cat.name" (click)="editCategory(cat, inputRef.value)"
                                    title="Save Changes">
                                    <i class="fa fa-save fs-5"></i>
                                </button>

                                <button class="btn btn-link text-danger p-0" (click)="removeCategory(cat)"
                                    title="Delete">
                                    <i class="fa fa-trash fs-5"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-flex justify-content-center mt-4">
        <pagination-controls (pageChange)="onTableDataChange($event)"></pagination-controls>
    </div>
</div>

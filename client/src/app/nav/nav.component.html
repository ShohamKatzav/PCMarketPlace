<nav class="navbar navbar-expand-md navbar-dark bg-primary fixed-top shadow-sm">
    <div class="container">
        <a (click)="closeNavbar()" class="navbar-brand fw-bold" routerLink="/">PC MARKETPLACE</a>

        <input (change)="toggleBodyScroll(sidemenu.checked)" class="side-menu" type="checkbox" id="side-menu"
            #sidemenu />
        <label class="hamb ml-auto" for="side-menu"><span class="hamb-line"></span></label>

        <div class="container nav">
            <ul class="menu navbar-nav">
                @if (currentUser()) {
                <li class="nav-item">
                    <a class="nav-link" routerLink="/deals" routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: true}" (click)="closeNavbar()">Available Deals</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/deals/my-deals" routerLinkActive="active"
                        (click)="closeNavbar()">My Deals</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/deals/new-deal" routerLinkActive="active"
                        (click)="closeNavbar()">List a Deal</a>
                </li>

                @if (currentMember()?.authorization === 'Admin') {
                <li class="nav-item">
                    <a class="nav-link text-warning" routerLink="/members" routerLinkActive="active"
                        (click)="closeNavbar()">
                        <i class="fa fa-users me-1"></i> Members
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-warning" routerLink="/categories" routerLinkActive="active"
                        (click)="closeNavbar()">
                        <i class="fa fa-list me-1"></i> Categories
                    </a>
                </li>
                }
                }
                <li class="nav-item">
                    <a class="nav-link" routerLink="/about-us" routerLinkActive="active"
                        (click)="closeNavbar()">About</a>
                </li>
            </ul>

            <div class="ms-auto d-flex align-items-center">
                @if (currentUser(); as user) {
                <div class="dropdown" dropdown>
                    <a class="text-light dropdown-toggle text-decoration-none" dropdownToggle role="button">
                        <i class="fa fa-user-circle me-1"></i> {{ user.username | titlecase }}
                    </a>
                    <div class="dropdown-menu dropdown-menu-end shadow" *dropdownMenu>
                        <a class="dropdown-item" routerLink="/member/edit" (click)="closeNavbar()">
                            <i class="fa fa-edit me-2"></i>Edit Profile
                        </a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item text-danger" (click)="logout()" style="cursor: pointer;">
                            <i class="fa fa-sign-out-alt me-2"></i>Logout
                        </a>
                    </div>
                </div>
                } @else {
                <form class="form-inline ml-auto" #loginForm="ngForm" (ngSubmit)="login()" autocomplete="off">
                    <input name="username" [(ngModel)]="model.username" class="form-control mr-sm-2" type="text"
                        placeholder="Username" autocomplete="username">
                    <input name="password" [(ngModel)]="model.password" class="form-control mr-sm-2" type="password"
                        placeholder="Password" autocomplete="current-password">
                    <button (click)="closeNavbar()" class="btn btn-outline-success my-2 my-sm-0"
                        type="submit">Login</button>
                </form>
                }
            </div>
        </div>
    </div>
</nav>

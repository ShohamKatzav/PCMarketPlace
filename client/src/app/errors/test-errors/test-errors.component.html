<div class="container mt-5">
    <h1 class="mb-4">Errors Test Utility</h1>

    <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-outline-primary" (click)="get404Error()">404 Not Found</button>
        <button class="btn btn-outline-primary" (click)="get400Error()">400 Bad Request</button>
        <button class="btn btn-outline-primary" (click)="get401Error()">401 Unauthorized</button>
        <button class="btn btn-outline-danger" (click)="get500Error()">500 Server Error</button>
        <button class="btn btn-outline-warning" (click)="get400Validation()">400 Validation</button>
    </div>

    @if (validationErrors.length > 0) {
    <div class="row mt-5">
        <div class="col-md-6">
            <div class="alert alert-danger shadow-sm">
                <ul class="mb-0">
                    @for (error of validationErrors; track $index) {
                    <li>{{ error }}</li>
                    }
                </ul>
            </div>
        </div>
    </div>
    }
</div>

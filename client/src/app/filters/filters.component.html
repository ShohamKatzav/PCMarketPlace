<div class="card shadow-sm border-0 bg-light p-3">
    <form [formGroup]="filterForm">
        <div class="row align-items-end g-3">

            <div class="col-md-4">
                <label class="form-label small fw-bold">Category</label>
                <select formControlName="category" (change)="onSelectCategory()" class="form-select">
                    <option value="Any">All Categories</option>
                    @for (cat of categories(); track cat.id) {
                    <option [value]="cat.name">{{cat.name}}</option>
                    }
                </select>
            </div>

            <div class="col-md-5">
                <label class="form-label small fw-bold">Price Range (ILS)</label>
                <div class="input-group">
                    <input type="number" formControlName="min" class="form-control" placeholder="Min" min="0">
                    <span class="input-group-text bg-white border-start-0 border-end-0 text-muted">to</span>
                    <input type="number" formControlName="max" class="form-control" placeholder="Max" min="0">
                </div>
            </div>

            <div class="col-md-3">
                <div class="d-flex gap-2">
                    <button type="button" (click)="onPriceFilter()"
                        class="btn btn-info text-white px-3 flex-grow-1 shadow-sm">
                        <i class="fa fa-filter me-1"></i> Filter Price
                    </button>

                    <button type="button" (click)="onInitFilter()" class="btn btn-dark px-3 flex-grow-1 shadow-sm"
                        title="Clear Filter">
                        <i class="fa fa-refresh"></i>
                    </button>
                </div>
            </div>

        </div>
    </form>
</div>

@if (member(); as m) {
<div class="container mt-5">
  <div class="row">
    <div class="col-12 mb-4">
      <h1 class="fw-bold text-uppercase">{{m.knownAs}}'S PROFILE</h1>
    </div>

    @if (editForm.dirty) {
    <div class="col-12">
      <div class="alert alert-info shadow-sm">
        <strong>Information: </strong> You have made changes. Any unsaved changes will be lost.
      </div>
    </div>
    }

    <div class="col-md-4">
      <div class="card shadow-sm border-0">
        <div class="profile-image-container">
          <img [src]="m.appUserPhoto?.url || './assets/user.png'" [alt]="m.knownAs"
            class="card-img-top img-thumbnail-custom" (error)="onImageError($event)">
        </div>

        <div class="card-body text-center">
          <div class="mb-2">
            <small class="text-muted d-block">Location</small>
            <span class="fw-bold">{{m.city}}, {{m.country}}</span>
          </div>
          <div class="mb-2">
            <small class="text-muted d-block">Age</small>
            <span class="fw-bold">{{m.age}}</span>
          </div>
          <div class="mb-0">
            <small class="text-muted d-block">Member since</small>
            <span class="fw-bold">{{m.created | date:'mediumDate'}}</span>
          </div>
        </div>

        <div class="card-footer bg-white border-0 p-3">
          <button [disabled]="!editForm.dirty" form="editForm" type="submit" class="btn btn-success w-100 py-2">
            SAVE CHANGES
          </button>
        </div>
      </div>
    </div>

    <div class="col-md-8">
      <form #editForm="ngForm" (ngSubmit)="updateMember()" id="editForm" autocomplete="off">
        <tabset class="member-tabset shadow-sm bg-white rounded">

          <tab heading="Basic Info">
            <div class="p-4">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label text-muted small fw-bold">Known As</label>
                  <input name="knownAs" [(ngModel)]="m.knownAs" class="form-control bg-light" type="text">
                </div>
                <div class="col-md-6">
                  <label class="form-label text-muted small fw-bold">Email</label>
                  <input name="email" [(ngModel)]="m.email" class="form-control bg-light" type="email">
                </div>

                <h5 class="mt-4 border-bottom pb-2">Location Details</h5>
                <div class="col-md-6">
                  <label class="form-label text-muted small fw-bold">City</label>
                  <input name="city" [(ngModel)]="m.city" class="form-control bg-light" type="text">
                </div>
                <div class="col-md-6">
                  <label class="form-label text-muted small fw-bold">Country</label>
                  <input name="country" [(ngModel)]="m.country" class="form-control bg-light" type="text">
                </div>

                <h5 class="mt-4 border-bottom pb-2">Contact</h5>
                <div class="col-12">
                  <label class="form-label text-muted small fw-bold">Phone</label>
                  <input name="phone" [(ngModel)]="m.phone" class="form-control bg-light w-50" type="text">
                </div>
              </div>
            </div>
          </tab>

          <tab heading="Photos">
            <div class="p-4">
              <app-photo-change [member]="m"></app-photo-change>
            </div>
          </tab>

        </tabset>
      </form>
    </div>
  </div>
</div>
}

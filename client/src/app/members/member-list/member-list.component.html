<div class="container-fluid mt-4 px-5">
  <div class="row align-items-center mb-5">
    <div class="col-xl-4 col-lg-5">
      <h1 class="fw-bold mb-0 text-dark">USER MANAGEMENT</h1>
      <p class="text-muted mb-0 small">View and edit member profile details and contact info.</p>
    </div>

    <div class="col-xl-8 col-lg-7">
      <div class="input-group shadow-sm border rounded">
        <span class="input-group-text bg-white border-0 py-3">
          <i class="fa fa-search text-muted"></i>
        </span>
        <input type="text" class="form-control border-0 bg-white" placeholder="Search by username or name..."
          [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)">
        <span class="input-group-text bg-white border-0 text-muted small pe-4">
          {{filteredMembers().length}} Members
        </span>
      </div>
    </div>
  </div>

  <hr class="mb-5 opacity-10">

  @if (filteredMembers().length > 0) {
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-6 g-4">
    @for (member of filteredMembers(); track member.id) {
    <div class="col">
      <app-member-card [member]="member"></app-member-card>
    </div>
    }
  </div>
  } @else {
  <div class="d-flex flex-column align-items-center justify-content-center mt-5">
    <i class="fa fa-users fa-3x text-muted mb-3"></i>
    <h4 class="text-muted mb-2">No members found</h4>
    <p class="text-muted text-center">Try adjusting your search criteria to find members.</p>
  </div>
  }
</div>
